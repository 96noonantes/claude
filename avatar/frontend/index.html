<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live2D アバター生成ツール</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <h1>Live2D アバター生成ツール</h1>
        <p class="subtitle">一枚の画像からLive2Dパーツを自動分解</p>
    </header>

    <main>
        <!-- Step 1: Upload -->
        <section id="upload-section" class="step active">
            <div id="drop-zone" class="drop-zone">
                <div class="drop-zone-content">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    <p class="drop-text">画像をドラッグ&ドロップ、またはクリップボードからペースト</p>
                    <p class="drop-hint">PNG / JPG / WebP（最大10MB）</p>
                    <button id="file-select-btn" class="btn btn-primary">ファイルを選択</button>
                    <input type="file" id="file-input" accept=".png,.jpg,.jpeg,.webp" hidden>
                </div>
            </div>
            <div id="upload-preview" class="upload-preview hidden">
                <img id="preview-img" alt="プレビュー">
                <div class="mode-selector">
                    <label class="mode-option selected" data-mode="full">
                        <input type="radio" name="decompose-mode" value="full" checked>
                        <div class="mode-card">
                            <div class="mode-title">フル分解</div>
                            <div class="mode-desc">顔・髪・体・衣装すべてをパーツ分解</div>
                        </div>
                    </label>
                    <label class="mode-option" data-mode="costume_only">
                        <input type="radio" name="decompose-mode" value="costume_only">
                        <div class="mode-card">
                            <div class="mode-title">衣装のみ抽出</div>
                            <div class="mode-desc">上着・下着・袖・靴などの衣装パーツだけを抽出</div>
                        </div>
                    </label>
                </div>
                <div class="upload-actions">
                    <button id="decompose-btn" class="btn btn-primary">パーツ分解を開始</button>
                    <button id="reset-btn" class="btn btn-secondary">別の画像を選択</button>
                </div>
            </div>
        </section>

        <!-- Loading -->
        <section id="loading-section" class="step hidden">
            <div class="loading-container">
                <div class="spinner"></div>
                <p class="loading-text">パーツを分解中...</p>
                <p class="loading-hint">AIが画像を解析してパーツに分離しています</p>
            </div>
        </section>

        <!-- Step 2: Part Editor + Live Preview -->
        <section id="editor-section" class="step hidden">
            <div class="view-tabs">
                <button class="view-tab active" data-view="editor">パーツ編集</button>
                <button class="view-tab" data-view="preview">ライブプレビュー</button>
            </div>

            <!-- Editor View -->
            <div id="editor-view" class="view-content">
                <div class="editor-layout">
                    <div class="editor-canvas-container">
                        <canvas id="editor-canvas"></canvas>
                        <div class="canvas-controls">
                            <button id="toggle-overlay" class="btn btn-small">オーバーレイ切替</button>
                            <button id="toggle-original" class="btn btn-small">元画像表示</button>
                        </div>
                    </div>
                    <div class="parts-panel">
                        <div class="panel-header">
                            <h3>検出パーツ一覧</h3>
                            <div id="gender-badge" class="gender-badge hidden"></div>
                        </div>
                        <div class="filter-bar">
                            <button class="filter-btn active" data-filter="all">すべて</button>
                            <button class="filter-btn" data-filter="female">♀ 女性用</button>
                            <button class="filter-btn" data-filter="male">♂ 男性用</button>
                            <button class="filter-btn" data-filter="unisex">⚥ 共用</button>
                        </div>
                        <div id="parts-list" class="parts-list"></div>
                        <div class="export-actions">
                            <button id="export-btn" class="btn btn-primary btn-large">
                                Cubism Editor用にエクスポート
                            </button>
                            <button id="back-to-upload" class="btn btn-secondary">戻る</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Live Preview View -->
            <div id="preview-view" class="view-content hidden">
                <div class="preview-layout">
                    <div class="preview-canvas-container">
                        <canvas id="preview-canvas"></canvas>
                    </div>
                    <div class="preview-controls">
                        <h3>アニメーション設定</h3>
                        <div class="anim-control">
                            <label>まばたき</label>
                            <input type="checkbox" id="anim-blink" checked>
                        </div>
                        <div class="anim-control">
                            <label>呼吸</label>
                            <input type="checkbox" id="anim-breath" checked>
                        </div>
                        <div class="anim-control">
                            <label>頭の揺れ</label>
                            <input type="checkbox" id="anim-head-sway" checked>
                        </div>
                        <div class="anim-control">
                            <label>髪揺れ</label>
                            <input type="checkbox" id="anim-hair" checked>
                        </div>
                        <div class="anim-control">
                            <label>スカート揺れ</label>
                            <input type="checkbox" id="anim-skirt" checked>
                        </div>
                        <div class="anim-control">
                            <label>マウス追従</label>
                            <input type="checkbox" id="anim-mouse-track" checked>
                        </div>
                        <div class="anim-control">
                            <label>口パクデモ</label>
                            <input type="checkbox" id="anim-lip-sync">
                        </div>
                        <hr class="control-divider">
                        <div class="anim-control">
                            <label>表情</label>
                            <select id="expression-select">
                                <option value="neutral">通常</option>
                                <option value="happy">喜び</option>
                                <option value="sad">悲しみ</option>
                                <option value="angry">怒り</option>
                                <option value="surprised">驚き</option>
                                <option value="embarrassed">照れ</option>
                                <option value="wink_left">ウインク（左）</option>
                                <option value="sleepy">眠い</option>
                                <option value="smug">ドヤ顔</option>
                            </select>
                        </div>
                        <hr class="control-divider">
                        <h3>体型調整</h3>
                        <div class="anim-control">
                            <label>身長</label>
                            <input type="range" id="body-height" min="0.7" max="1.3" step="0.01" value="1.0" class="slider">
                            <span id="body-height-val" class="slider-val">1.0</span>
                        </div>
                        <div class="anim-control">
                            <label>肩幅</label>
                            <input type="range" id="body-shoulder" min="0.7" max="1.3" step="0.01" value="1.0" class="slider">
                            <span id="body-shoulder-val" class="slider-val">1.0</span>
                        </div>
                        <div class="anim-control">
                            <label>ウエスト</label>
                            <input type="range" id="body-waist" min="0.7" max="1.3" step="0.01" value="1.0" class="slider">
                            <span id="body-waist-val" class="slider-val">1.0</span>
                        </div>
                        <div class="anim-control">
                            <label>ヒップ</label>
                            <input type="range" id="body-hip" min="0.7" max="1.3" step="0.01" value="1.0" class="slider">
                            <span id="body-hip-val" class="slider-val">1.0</span>
                        </div>
                        <div class="anim-control">
                            <label>脚長</label>
                            <input type="range" id="body-leg" min="0.7" max="1.3" step="0.01" value="1.0" class="slider">
                            <span id="body-leg-val" class="slider-val">1.0</span>
                        </div>
                        <div class="anim-control">
                            <label>髪色</label>
                            <input type="color" id="hair-color" value="#808080" class="color-picker">
                        </div>
                        <div class="anim-control">
                            <label>肌色</label>
                            <input type="color" id="skin-color" value="#f0d2b4" class="color-picker">
                        </div>
                        <div class="export-actions" style="margin-top:1rem">
                            <button id="export-btn-preview" class="btn btn-primary btn-large">
                                Cubism Editor用にエクスポート
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="toast" class="toast hidden"></div>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/uploader.js"></script>
    <script src="/static/js/partEditor.js"></script>
    <script src="/static/js/animationEngine.js"></script>
    <script src="/static/js/preview.js"></script>
    <script src="/static/js/bodyEditor.js"></script>
</body>
</html>
